# /etc/nginx/sites-available/www.restocare.in  (symlink into sites-enabled)
# Canonical host is https://www.restocare.in (lib/site-identity.ts); the apex redirects to it.
# Written for nginx 1.24 (Ubuntu 24.04): `listen ... http2`, not the 1.25+ `http2 on;`.
# The certificate must exist before this file is enabled: see docs/self-hosting.md for the order.

upstream restocare_frontend {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name restocare.in www.restocare.in;

  # certbot --nginx answers its challenge here; everything else goes to HTTPS.
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://www.restocare.in$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name restocare.in;

  ssl_certificate     /etc/letsencrypt/live/restocare.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restocare.in/privkey.pem;

  return 301 https://www.restocare.in$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.restocare.in;

  ssl_certificate     /etc/letsencrypt/live/restocare.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/restocare.in/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000" always;

  client_max_body_size 5m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 1024;

  # Product videos: Next sends max-age=0 for files in public/, so cache them for a day here.
  location /videos/ {
    proxy_pass http://restocare_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    proxy_pass http://restocare_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
