name: Docker image

# Builds the self-hosted website image and pushes it to GHCR. Going live is a
# separate step: the VPS pulls the new image (see docs/self-hosting.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Public values for /.well-known/assetlinks.json (read at build time).
          # Set as repository variables (Settings > Secrets and variables > Actions > Variables).
          build-args: |
            ANDROID_PACKAGE_NAME=${{ vars.ANDROID_PACKAGE_NAME || 'com.restocare.customer' }}
            ANDROID_CERT_SHA256=${{ vars.ANDROID_CERT_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
