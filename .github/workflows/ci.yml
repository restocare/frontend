name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Non-blocking until the existing lint errors are cleared (WEB-02).
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      # NEXT_PUBLIC_* values come from the committed .env.production.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
